
<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz">
    <h1>Simple Quiz</h1>

    <h3 id="question"></h3>

    <div id="answers"></div>

    <button id="next">Next</button>

    <h2 id="result"></h2>

    <button id="restart" style="display:none">
        Restart Quiz
    </button>
</div>

<script src="script.js"></script>
</body>
</html>
